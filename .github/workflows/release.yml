# Pushing an annotated vX.Y.Z tag on main runs the checks, builds the app and its agent command line
# for Windows and Linux, and creates a draft GitHub Release with the binaries and their SHA-256
# checksums. The release notes are written by hand in the draft before it's published
# (docs/adr/0019-release-by-pushing-a-tag-that-builds-a-draft-github-release.md).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Full history and tags, so the tag stays annotated and main can be compared against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is an annotated vX.Y.Z tag on main
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME isn't a vX.Y.Z version"
            exit 1
          fi
          if [ "$(git cat-file -t "$GITHUB_REF")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; use git tag -a"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME doesn't point at a commit on main"
            exit 1
          fi

  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: [verify-tag, check]
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows
            wails-flags: ""
          # Ubuntu only packages WebKitGTK 4.1, which Wails v2 uses with the webkit2_41 tag. Pinned,
          # because the binary needs a glibc at least as new as the runner's.
          - os: ubuntu-24.04
            target: linux
            wails-flags: -tags webkit2_41
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No caches: a release is built from scratch, so nothing a cache picked up elsewhere can end
      # up in the binaries.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # The Wails CLI at the same version as the wails module in go.mod. go install checks it
      # against the Go checksum database.
      - run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      # The frontend is built here with npm ci, and wails build skips it (-s), because Wails would
      # run npm install, which can change the lockfile. The bindings in frontend/wailsjs are
      # committed, so they aren't regenerated either.
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build

      - run: wails build -s -skipbindings -clean -trimpath ${{ matrix.wails-flags }}

      # The agent command line, built from the same commit into the same folder as the app, so the
      # two always share a schema (docs/adr/0023-let-users-drive-agent-tasks-from-their-own-agent-through-a-cli.md).
      # It's a console program, with no frontend or Wails build tags. -s -w strips the symbol table
      # and debug info, as wails build does for the app; panics still give file and line.
      - run: go build -trimpath -ldflags "-s -w" -o "build/bin/callback-cli${{ matrix.target == 'windows' && '.exe' || '' }}" ./cmd/callback-cli

      - name: Name the binaries for the release
        run: |
          mkdir dist
          if [ "${{ matrix.target }}" = windows ]; then
            mv build/bin/callback.exe "dist/callback-$GITHUB_REF_NAME-windows-amd64.exe"
            mv build/bin/callback-cli.exe "dist/callback-cli-$GITHUB_REF_NAME-windows-amd64.exe"
          else
            tar -czf "dist/callback-$GITHUB_REF_NAME-linux-amd64.tar.gz" -C build/bin callback callback-cli
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 5

  # The only job with write access. It runs no project code, only gh on the built files.
  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum callback-* > checksums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes "" ./*
